<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Helper</title>
  </head>

  <script>
    /**
     * @param {string} htmlString
     */
    function createElementFromHTML(htmlString) {
      var div = document.createElement("div");
      div.innerHTML = htmlString.trim();

      // Change this to div.childNodes to support multiple top-level nodes.
      return div.firstChild;
    }

    function generateWeek(
      school,
      department,
      schoolYear,
      timePeriod,
      monA,
      monB,
      tueA,
      tueB,
      wedA,
      wedB,
      thuA,
      thuB,
      friA,
      friB
    ) {
      var mainString = `<div class="print-a4-landscape print-font-size-100 print-sheet"><div><div style=margin-bottom:3px><span style=display:block;font-weight:700;font-size:16px;margin-bottom:8px;text-align:center>ROZVRH TÝŽDENNEJ ČINNOSTI V ŠKOLSKOM KLUBE DETÍ</span><table style=width:100%;table-layout:fixed><tr><td>Názov školského zariadenia: <b>${school}</b><td>oddelenie: <b>${department}</b><tr><td>v školskom roku: <b>${schoolYear}</b></table></div><table style="border:1px solid #000;width:100%;table-layout:fixed"><col style=width:10%><col style=width:50%><col style=width:40%><thead><tr style=height:30px><th style="border:1px solid #000;font-weight:400;padding:4px;text-align:center"rowspan=2>Deň<th style="border:1px solid #000;font-weight:400;text-align:center;padding:4px"colspan=2><b>Výchovno-vzdelávacia činnosť od – do</b><br><span class=title-weeks>${timePeriod}</span><tr><th style="border:1px solid #000;font-weight:400;padding:4px;text-align:center">Činnosť oddychová, činnosť rekreačná (Vrátane TOV)<th style="border:1px solid #000;font-weight:400;padding:4px;text-align:center">Príprava na vyučovanie</thead><tr style="height:100px;border:1px solid #000"class=print-nobreakafter><td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center;text-align:center">Pondelok<td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center">${monA}<td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center">${monB}<tr style="height:100px;border:1px solid #000"class=print-nobreakafter><td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center;text-align:center">Utorok<td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center">${tueA}<td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center">${tueB}<tr style="height:100px;border:1px solid #000"class=print-nobreakafter><td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center;text-align:center">Streda<td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center">${wedA}<td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center">${wedB}<tr style="height:100px;border:1px solid #000"class=print-nobreakafter><td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center;text-align:center">Štvrtok<td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center">${thuA}<td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center">${thuB}<tr style="height:100px;border:1px solid #000"class=print-nobreakafter><td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center;text-align:center">Piatok<td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center">${friA}<td style="border:1px solid #000;font-weight:400;padding:4px;vertical-align:center">${friB}</table></div><div style=margin-top:.5em;text-align:right;margin-top:48px>Vychovávateľ/ka: ......................................................................</div><span style=color:gray;font-size:9px>046 MŠVVaŠ SR / od 01. 09. 2018 Rozvrh týždennej činnosti v ŠKD</span></div>`;
      return createElementFromHTML(mainString);
    }

    function getDetails(day) {
      var days = Array.from(day.getElementsByClassName("print-nobreakafter")).map(item => item.children[1].innerText);
      
      var monVal = days[0].split('\n').slice(1,3)
      var tueVal = days[1].split('\n').slice(1,3)
      var wedVal = days[2].split('\n').slice(1,3)
      var thuVal = days[3].split('\n').slice(1,3)
      var friVal = days[4].split('\n').slice(1,3)
      
      return {
        timePeriod: day.children[0].children[0].children[1].textContent,
        mon: monVal.length > 0 ? monVal : [days[0]],
        tue: tueVal.length > 0 ? tueVal : [days[1]],
        wed: wedVal.length > 0 ? wedVal : [days[2]],
        thu: thuVal.length > 0 ? thuVal : [days[3]],
        fri: friVal.length > 0 ? friVal : [days[4]],
      }
    }

    function readSingleFile(e) {
      var file = e.target.files[0];
      if (!file) {
        return;
      }
      var reader = new FileReader();
      reader.onload = function (e) {
        var contents = e.target.result;
        openInNewWindow(contents);
      };
      reader.readAsText(file);
    }

    function openInNewWindow(contents) {
      var newWindow = window.open("", "_blank");
      newWindow.document.write(contents);

      var A4Array = newWindow.document.getElementsByClassName("g_echobody")[0];
      var filteredDays = Array.from(
        newWindow.document.getElementsByClassName("print-sheet")
      ).filter((item) => {
        console.log(item.innerHTML);
        return item.innerHTML.includes(">Rozvrh týždennej činnosti</span>");
      });

      // Delete all pages
      A4Array.replaceChildren();

      // Get additional details
      var schoolName = document.getElementById("schoolName").value;
      var departmentName = document.getElementById("departmentName").value;
      var schoolYear = document.getElementById("schoolYear").value;

      filteredDays.forEach((dayA4) => {
        var dayDetails = getDetails(dayA4)
        A4Array.appendChild(
          generateWeek(
            schoolName,
            departmentName,
            schoolYear,
            dayDetails.timePeriod,
            dayDetails.mon[0] ?? "",
            dayDetails.mon[1] ?? "",
            dayDetails.tue[0] ?? "",
            dayDetails.tue[1] ?? "",
            dayDetails.wed[0] ?? "",
            dayDetails.wed[1] ?? "",
            dayDetails.thu[0] ?? "",
            dayDetails.thu[1] ?? "",
            dayDetails.fri[0] ?? "",
            dayDetails.fri[1] ?? "",
          )
        );
      });
    }

    // Onload
    window.onload = () => {
      // Assign button functionality to load file
      document
        .getElementById("getFile")
        .addEventListener("change", readSingleFile, false);
    };
  </script>

  <label for="schoolName">Škola:</label>
  <input type="text" id="schoolName" name="schoolName" />
  <br />
  <br />
  <label for="departmentName">Oddelenie:</label>
  <input type="text" id="departmentName" name="departmentName" />
  <br />
  <br />
  <label for="schoolYear">Školský rok:</label>
  <input type="text" id="schoolYear" name="schoolYear" />
  <br />
  <br />

  <button onclick="document.getElementById('getFile').click()">
    Vyberte HTML súbor
  </button>
  <input type="file" id="getFile" style="display: none" />
</html>
